# Continuous integration: build the site, run the Worker tests, the link
# checker and the accessibility audit on every pull request and on every push
# to main.  Deployment itself is done by Cloudflare Workers Builds (see
# docs/CLOUDFLARE-SETUP.md), not by this workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch/PR supersedes a running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Normal duration is ~2 minutes; never let a stalled runner sit for hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # The Chromium build is cached per Playwright version so the download
      # (from Playwright's CDN) happens once; the runner image already ships
      # the system libraries Chromium needs, so we do not run apt-get
      # (`--with-deps`), which is what used to stall for 10+ minutes.
      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for the accessibility audit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Build (preview mode) and check
        run: npm run check
      - name: Build (production mode) and check links
        run: SITE_MODE=subdomain npx eleventy --quiet && SITE_MODE=subdomain node scripts/check-links.js
